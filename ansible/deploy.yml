- name: Развертывание серверного бота
  hosts: bot_servers
  tasks:
    - name: Создать каталог для развёртывания бота
      ansible.builtin.file:
        path: /home/alex/server-monitor-bot-deployed
        state: directory
    - name: Создать каталог для скриптов
      ansible.builtin.file:
        path: /home/alex/server-monitor-bot-deployed/scripts
        state: directory
    - name: Скопировать скрипт состояния сервера
      ansible.builtin.copy:
        src: ../scripts/status.sh
        dest: /home/alex/server-monitor-bot-deployed/scripts/status.sh
        mode: '0755'
    - name: Скопировать программу запуска скрипта
      ansible.builtin.copy:
        src: ../run_status.py
        dest: /home/alex/server-monitor-bot-deployed/run_status.py
        mode: '0644'    
                    