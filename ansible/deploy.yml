- name: Развертывание серверного бота
  hosts: bot_servers
  tasks:
    - name: Установить поддержку виртуальных окружений Python
      become: true
      ansible.builtin.apt:
        name: python3-venv
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Создать каталог для развёртывания бота
      ansible.builtin.file:
        path: /home/alex/server-monitor-bot-deployed
        state: directory
    - name: Создать каталог для скриптов
      ansible.builtin.file:
        path: /home/alex/server-monitor-bot-deployed/scripts
        state: directory
    - name: Скопировать скрипт состояния сервера
      ansible.builtin.copy:
        src: ../scripts/status.sh
        dest: /home/alex/server-monitor-bot-deployed/scripts/status.sh
        mode: '0755'
    - name: Скопировать программу запуска скрипта
      ansible.builtin.copy:
        src: ../run_status.py
        dest: /home/alex/server-monitor-bot-deployed/run_status.py
        mode: '0644'
      notify: Перезапустить бота   
    - name: Скопировать bot.py
      ansible.builtin.copy:    
        src: ../bot.py
        dest: /home/alex/server-monitor-bot-deployed/bot.py
        mode: '0644'
      notify: Перезапустить бота           
    - name: Скопировать requirements.txt
      ansible.builtin.copy:
        src: ../requirements.txt
        dest: /home/alex/server-monitor-bot-deployed/requirements.txt
        mode: '0644'
    - name: Создать виртуальное окружение бота
      ansible.builtin.command:
        cmd: python3 -m venv /home/alex/server-monitor-bot-deployed/.venv
        creates: /home/alex/server-monitor-bot-deployed/.venv/bin/python
    - name: Установить зависимости бота
      ansible.builtin.pip:
        requirements: /home/alex/server-monitor-bot-deployed/requirements.txt
        executable: /home/alex/server-monitor-bot-deployed/.venv/bin/pip
      notify: Перезапустить бота   
    - name: Скопировать .env
      ansible.builtin.copy:
        src: ../.env
        dest: /home/alex/server-monitor-bot-deployed/.env
        mode: '0600'
      no_log: true
      notify: Перезапустить бота 
    - name: Скопировать server-monitor-bot.service
      ansible.builtin.copy:
        src: server-monitor-bot.service
        dest: /etc/systemd/system/server-monitor-bot.service
        mode: '0644'
      become: True
      notify: Перезапустить бота     
    - name: Включить и запустить службу бота
      ansible.builtin.systemd_service:
        name: server-monitor-bot.service
        daemon_reload: true
        enabled: true
        state: started
      become: true
  handlers:
    - name: Перезапустить бота
      become: true
      ansible.builtin.systemd_service:
        name: server-monitor-bot.service
        state: restarted 
