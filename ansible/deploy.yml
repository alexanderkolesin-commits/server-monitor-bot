- name: Развертывание серверного бота
  hosts: bot_servers
  tasks:
    - name: Установить Docker и Docker Compose
      become: true
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Создать каталог для развёртывания бота
      ansible.builtin.file:
        path: /home/alex/server-monitor-bot-deployed
        state: directory
    - name: Создать каталог для скриптов
      ansible.builtin.file:
        path: /home/alex/server-monitor-bot-deployed/scripts
        state: directory
    - name: Создать каталог для SSH-файлов бота
      ansible.builtin.file:
        path: /home/alex/server-monitor-bot-deployed/ssh
        state: directory
        mode: '0700'
    - name: Скопировать SSH-ключ бота
      ansible.builtin.copy:
        src: /home/alexandr/.ssh/server-monitor-bot
        dest: /home/alex/server-monitor-bot-deployed/ssh/id_ed25519
        mode: '0600'
      no_log: true
    - name: Скопировать известные ключи серверов
      ansible.builtin.copy:
        src: /home/alexandr/.ssh/known_hosts
        dest: /home/alex/server-monitor-bot-deployed/ssh/known_hosts
        mode: '0644'          
    - name: Скопировать скрипт состояния сервера
      ansible.builtin.copy:
        src: ../scripts/status.sh
        dest: /home/alex/server-monitor-bot-deployed/scripts/status.sh
        mode: '0755'     
    - name: Скопировать конфигурацию Compose
      ansible.builtin.copy:
        src: ../compose.yaml
        dest: /home/alex/server-monitor-bot-deployed/compose.yaml
        mode: '0644'              
    - name: Скопировать .env
      ansible.builtin.copy:
        src: ../.env
        dest: /home/alex/server-monitor-bot-deployed/.env
        mode: '0600'
      no_log: true
    - name: Остановить старую службу бота и отключить её автозапуск
      become: true
      ansible.builtin.systemd_service:
        name: server-monitor-bot.service
        enabled: false
        state: stopped
    - name: Включить и запустить Docker
      become: true
      ansible.builtin.systemd_service:
        name: docker.service
        enabled: true
        state: started
    - name: Скопировать манифест namespace    
      ansible.builtin.copy:
        src: ../k8s/namespace.yaml
        dest: /home/alex/server-monitor-bot-deployed/namespace.yaml
        mode: '0644'
    - name: Создать namespace бота
      become: true
      ansible.builtin.command:
        argv:
        - /usr/local/bin/kubectl
        - apply
        - -f 
        - /home/alex/server-monitor-bot-deployed/namespace.yaml
      register: namespace_result
      changed_when: "'created' in namespace_result.stdout or 'configured' in namespace_result.stdout"
    - name: Подготовить Secret с переменными бота
      become: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - -n 
          - server-monitor
          - create 
          - secret
          - generic
          - bot-env
          - --from-env-file=/home/alex/server-monitor-bot-deployed/.env
          - --dry-run=client
          - -o 
          - yaml
      register: bot_env_manifest
      changed_when: false
      no_log: true
    - name: Применить Secret с переменными бота
      become: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - apply
          - -f 
          - "-"
        stdin: "{{ bot_env_manifest.stdout }}"
      register: bot_env_result
      changed_when: "'created' in bot_env_result.stdout or 'configured' in bot_env_result.stdout"
      no_log: true
    - name: Подготовить Secret с SSH-файлами бота
      become: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - -n
          - server-monitor
          - create
          - secret
          - generic
          - bot-ssh
          - --from-file=id_ed25519=/home/alex/server-monitor-bot-deployed/ssh/id_ed25519
          - --from-file=known_hosts=/home/alex/server-monitor-bot-deployed/ssh/known_hosts
          - --dry-run=client
          - -o
          - yaml
      register: bot_ssh_manifest
      changed_when: false
      no_log: true
    - name: Применить Secret с SSH-файлами бота
      become: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - apply
          - -f 
          - "-"
        stdin: "{{ bot_ssh_manifest.stdout }}"
      register: bot_ssh_result
      changed_when: "'created' in bot_ssh_result.stdout or 'configured' in bot_ssh_result.stdout"
      no_log: true                         
    - name: Скопировать манифест Kubernetes
      ansible.builtin.copy:
        src: ../k8s/deployment.yaml
        dest: /home/alex/server-monitor-bot-deployed/deployment.yaml
        mode: '0644'
    - name: Применить манифест бота
      become: true
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - apply
          - -f    
          - /home/alex/server-monitor-bot-deployed/deployment.yaml
      register: deployment_result
      changed_when: "'created' in deployment_result.stdout or 'configured' in deployment_result.stdout"            

