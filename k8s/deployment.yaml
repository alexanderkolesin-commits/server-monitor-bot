apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-monitor-bot
  namespace: server-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server-monitor-bot
  template:
    metadata:
      labels:
        app: server-monitor-bot
    spec:
      containers:
        - name: bot
          image: akolesin/server-monitor-bot:v4
          envFrom:
            - secretRef:
                name: bot-env
          volumeMounts:
            - name: ssh
              mountPath: /run/ssh-key
              subPath: id_ed25519
              readOnly: true
            - name: ssh
              mountPath: /run/known_hosts                  
              subPath: known_hosts
              readOnly: true
      volumes:
        - name: ssh
          secret:
            secretName: bot-ssh
            defaultMode: 0400        